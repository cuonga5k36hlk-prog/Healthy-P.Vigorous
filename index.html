<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phàm Nhân Tu Tiên 3D - Siêu Phẩm Đối Kháng</title>
  
  <!-- Three.js Core & GLTF Loader -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  
  <!-- Postprocessing: Unreal Bloom Effect -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
    body { background-color: #010408; overflow: hidden; height: 100vh; font-family: 'Cinzel', 'Segoe UI', serif; }
    #canvas-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; }
    
    /* Giao Diện Game Đẳng Cấp Tiên Hiệp */
    .hud-layer { position: absolute; pointer-events: none; z-index: 10; width: 100%; height: 100%; }

    /* Thanh máu Boss (Phía trên cùng) */
    #boss-container {
      position: absolute; top: 25px; left: 50%; transform: translateX(-50%);
      width: 580px; text-align: center;
    }
    .boss-name {
      font-size: 16px; font-weight: bold; color: #f87171; letter-spacing: 3px;
      text-transform: uppercase; margin-bottom: 6px; text-shadow: 0 0 10px #ef4444;
    }
    .boss-bar-bg {
      width: 100%; height: 14px; background: rgba(15, 23, 42, 0.85);
      border: 1.5px solid #7f1d1d; border-radius: 7px; overflow: hidden;
      box-shadow: 0 0 15px rgba(239, 68, 68, 0.3);
    }
    #boss-hp-fill {
      width: 100%; height: 100%; background: linear-gradient(90deg, #991b1b, #ef4444);
      transition: width 0.15s ease-out; box-shadow: 0 0 12px #ef4444;
    }

    /* Thanh Chỉ Số Nhân Vật (Góc dưới bên trái) */
    #player-stats {
      position: absolute; bottom: 30px; left: 30px; width: 320px;
      background: rgba(4, 9, 20, 0.75); border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 16px; border-radius: 8px; backdrop-filter: blur(8px);
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.15);
    }
    .player-title { font-size: 14px; font-weight: bold; color: #38bdf8; margin-bottom: 10px; letter-spacing: 1px; }
    .stat-row { display: flex; align-items: center; margin-bottom: 6px; font-size: 12px; gap: 8px; }
    .stat-label { width: 75px; color: #94a3b8; font-weight: 600; }
    .stat-bar { flex: 1; height: 10px; background: #0f172a; border-radius: 5px; overflow: hidden; border: 1px solid #334155; }
    .fill { height: 100%; width: 100%; transition: width 0.1s; }
    #hp-bar { background: linear-gradient(90deg, #dc2626, #ef4444); }
    #mp-bar { background: linear-gradient(90deg, #0284c7, #38bdf8); }
    #sense-bar { background: linear-gradient(90deg, #7c3aed, #c084fc); }

    /* Hướng dẫn thao tác */
    #skill-deck {
      position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 12px;
    }
    .deck-item {
      background: rgba(10, 17, 32, 0.85); border: 1px solid rgba(56, 189, 248, 0.25);
      padding: 8px 16px; border-radius: 6px; text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    .deck-key { font-size: 11px; color: #38bdf8; font-weight: bold; display: block; }
    .deck-name { font-size: 13px; color: #f1f5f9; font-weight: 600; }

    /* Hồng tâm khóa mục tiêu */
    #lock-reticle {
      position: absolute; width: 44px; height: 44px; border: 2px dashed #ef4444;
      border-radius: 50%; display: none; transform: translate(-50%, -50%);
      animation: spinReticle 4s linear infinite; box-shadow: 0 0 10px #ef4444;
    }
    @keyframes spinReticle { 100% { transform: translate(-50%, -50%) rotate(360deg); } }

    /* Màn hình loading */
    #loader {
      position: absolute; width: 100%; height: 100%; background: #020408;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      z-index: 100; color: #38bdf8; font-size: 20px; letter-spacing: 2px;
    }
    .spinner {
      width: 50px; height: 50px; border: 3px solid rgba(56, 189, 248, 0.2);
      border-top-color: #38bdf8; border-radius: 50%; animation: spin 1s infinite linear;
      margin-bottom: 20px;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div id="loader">
    <div class="spinner"></div>
    <div>Đang Tụ Linh Khí & Tải Mô Hình 3D...</div>
  </div>

  <div id="canvas-container"></div>

  <div class="hud-layer">
    <!-- Boss HUD -->
    <div id="boss-container">
      <div class="boss-name">Cực Âm Tổ Sư (Nguyên Anh Kỳ)</div>
      <div class="boss-bar-bg">
        <div id="boss-hp-fill"></div>
      </div>
    </div>

    <!-- Player HUD -->
    <div id="player-stats">
      <div class="player-title">Hàn Lập (Trúc Cơ Kỳ)</div>
      <div class="stat-row">
        <span class="stat-label">Khí Huyết</span>
        <div class="stat-bar"><div id="hp-bar" class="fill"></div></div>
      </div>
      <div class="stat-row">
        <span class="stat-label">Pháp Lực</span>
        <div class="stat-bar"><div id="mp-bar" class="fill"></div></div>
      </div>
      <div class="stat-row">
        <span class="stat-label">Thần Thức</span>
        <div class="stat-bar"><div id="sense-bar" class="fill"></div></div>
      </div>
    </div>

    <!-- Deck kỹ năng -->
    <div id="skill-deck">
      <div class="deck-item"><span class="deck-key">Chuột Trái / J</span><span class="deck-name">Vạn Kiếm Quyết</span></div>
      <div class="deck-item"><span class="deck-key">Space / K</span><span class="deck-name">Phong Lôi Dực</span></div>
      <div class="deck-item"><span class="deck-key">Q / U</span><span class="deck-name">Kiếm Trận (40 MP)</span></div>
      <div class="deck-item"><span class="deck-key">Tab</span><span class="deck-name">Khóa Mục Tiêu</span></div>
    </div>

    <div id="lock-reticle"></div>
  </div>

  <script>
    // --- 1. KHỞI TẠO THREE.JS VÀ POST-PROCESSING ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x02040a);
    scene.fog = new THREE.FogExp2(0x02040a, 0.012);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.3;
    container.appendChild(renderer.domElement);

    // Unreal Bloom: Tạo hiệu ứng phát sáng cho kiếm và ma khí
    const renderScene = new THREE.RenderPass(scene, camera);
    const bloomPass = new THREE.UnrealBloomPass(
      new THREE.Vector2(window.innerWidth, window.innerHeight),
      1.6,  // Strength
      0.35, // Radius
      0.2   // Threshold
    );
    const composer = new THREE.EffectComposer(renderer);
    composer.addPass(renderScene);
    composer.addPass(bloomPass);

    // Ánh sáng môi trường
    const ambLight = new THREE.AmbientLight(0x0a1428, 2.2);
    scene.add(ambLight);

    const mainLight = new THREE.DirectionalLight(0xdbeafe, 2.5);
    mainLight.position.set(25, 45, 20);
    mainLight.castShadow = true;
    mainLight.shadow.mapSize.width = 2048;
    mainLight.shadow.mapSize.height = 2048;
    scene.add(mainLight);

    // --- 2. SÀN ĐẤU CỔ TRẬN BÁT QUÁI ---
    function buildArenaTexture() {
      const cv = document.createElement('canvas');
      cv.width = 1024; cv.height = 1024;
      const ctx = cv.getContext('2d');
      ctx.fillStyle = '#060a12'; ctx.fillRect(0, 0, 1024, 1024);
      ctx.strokeStyle = '#00f0ff'; ctx.lineWidth = 5;
      ctx.shadowColor = '#00f0ff'; ctx.shadowBlur = 18;

      ctx.beginPath(); ctx.arc(512, 512, 480, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.arc(512, 512, 360, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.arc(512, 512, 200, 0, Math.PI * 2); ctx.stroke();

      for (let i = 0; i < 8; i++) {
        const rad = (Math.PI * 2 / 8) * i;
        ctx.save();
        ctx.translate(512, 512); ctx.rotate(rad);
        ctx.strokeRect(-25, 390, 50, 14);
        ctx.strokeRect(-25, 420, 50, 14);
        ctx.restore();
      }
      return new THREE.CanvasTexture(cv);
    }

    const arenaMesh = new THREE.Mesh(
      new THREE.CylinderGeometry(36, 38, 2, 64),
      new THREE.MeshStandardMaterial({ map: buildArenaTexture(), roughness: 0.35, metalness: 0.65 })
    );
    arenaMesh.position.y = -1;
    arenaMesh.receiveShadow = true;
    scene.add(arenaMesh);

    // --- 3. TẠO THANH TRÚC PHONG VÂN KIẾM 3D TINH XẢO ---
    function makeSword3D() {
      const sw = new THREE.Group();
      // Thân kiếm phát sáng
      const blade = new THREE.Mesh(
        new THREE.BoxGeometry(0.08, 2.0, 0.02),
        new THREE.MeshStandardMaterial({
          color: 0xa7f3d0, emissive: 0x10b981, emissiveIntensity: 1.8,
          metalness: 0.9, roughness: 0.1
        })
      );
      blade.position.y = 1.0;
      blade.castShadow = true;
      sw.add(blade);

      // Mũi nhọn
      const tip = new THREE.Mesh(
        new THREE.ConeGeometry(0.057, 0.45, 4),
        blade.material
      );
      tip.position.y = 2.15; tip.rotation.y = Math.PI / 4;
      sw.add(tip);

      // Đốc kiếm mạ vàng
      const guard = new THREE.Mesh(
        new THREE.BoxGeometry(0.4, 0.08, 0.08),
        new THREE.MeshStandardMaterial({ color: 0xfbbf24, metalness: 0.9 })
      );
      sw.add(guard);
      sw.scale.set(0.9, 0.9, 0.9);
      return sw;
    }

    // --- 4. TẢI MÔ HÌNH NHÂN VẬT THỰC THỤ CÓ KHUNG XƯƠNG (GLTF LOADER) ---
    const loader = new THREE.GLTFLoader();
    const clock = new THREE.Clock();

    let playerMixer, bossMixer;
    const playerActions = {}, bossActions = {};
    const playerGroup = new THREE.Group();
    const bossGroup = new THREE.Group();
    scene.add(playerGroup);
    scene.add(bossGroup);

    playerGroup.position.set(0, 0, 16);
    bossGroup.position.set(0, 0, -16);

    // Dùng mô hình hoạt họa thực tế từ kho chuẩn glTF CDN
    const MODEL_URL = 'https://threejs.org/examples/models/gltf/Soldier.glb';

    loader.load(MODEL_URL, function (gltf) {
      // 1. Setup Nhân vật Người chơi (Hàn Lập)
      const pModel = gltf.scene;
      pModel.scale.set(2.2, 2.2, 2.2);
      pModel.traverse(o => {
        if (o.isMesh) {
          o.castShadow = true;
          o.material = new THREE.MeshStandardMaterial({
            color: 0x0284c7, roughness: 0.4, metalness: 0.2
          });
        }
      });
      playerGroup.add(pModel);

      playerMixer = new THREE.AnimationMixer(pModel);
      playerActions['idle'] = playerMixer.clipAction(gltf.animations[0]);
      playerActions['run'] = playerMixer.clipAction(gltf.animations[1]);
      playerActions['attack'] = playerMixer.clipAction(gltf.animations[3]);
      playerActions['idle'].play();

      // 2. Setup Boss (Cực Âm Tổ Sư)
      loader.load(MODEL_URL, function (bGltf) {
        const bModel = bGltf.scene;
        bModel.scale.set(2.6, 2.6, 2.6);
        bModel.traverse(o => {
          if (o.isMesh) {
            o.castShadow = true;
            o.material = new THREE.MeshStandardMaterial({
              color: 0x7f1d1d, roughness: 0.3, emissive: 0x450a0a, emissiveIntensity: 0.6
            });
          }
        });
        bossGroup.add(bModel);

        bossMixer = new THREE.AnimationMixer(bModel);
        bossActions['idle'] = bossMixer.clipAction(bGltf.animations[0]);
        bossActions['run'] = bossMixer.clipAction(bGltf.animations[1]);
        bossActions['attack'] = bossMixer.clipAction(bGltf.animations[3]);
        bossActions['idle'].play();

        // Tải xong -> Ẩn màn hình loading
        document.getElementById('loader').style.display = 'none';
      });
    });

    // 12 Phi Kiếm Canh Kim lơ lửng quanh Hàn Lập
    const orbitSwords = [];
    for (let i = 0; i < 12; i++) {
      const sw = makeSword3D();
      scene.add(sw);
      orbitSwords.push(sw);
    }

    // --- 5. LOGIC DỮ LIỆU & CHIẾN ĐẤU ---
    const player = {
      hp: 100, maxHp: 100, mp: 100, maxMp: 100,
      swords: 12, speed: 0.28, orbitAngle: 0,
      dashCd: 0, isDashing: false, isLocked: false
    };

    const boss = {
      hp: 800, maxHp: 800, speed: 0.14, attackCd: 90
    };

    const activeProjectiles = [];
    const bossProjectiles = [];
    const swordArrays = [];

    // --- 6. PHÍM ĐIỀU KHIỂN & SỰ KIỆN ---
    const keys = {};
    window.addEventListener('keydown', e => {
      keys[e.key.toLowerCase()] = true;
      if (e.key === ' ' || e.key.toLowerCase() === 'k') castDash();
      if (e.key.toLowerCase() === 'q' || e.key.toLowerCase() === 'u') castSwordArray();
      if (e.key.toLowerCase() === 'j') castShootSword();
      if (e.key === 'Tab') {
        e.preventDefault();
        player.isLocked = !player.isLocked;
        document.getElementById('lock-reticle').style.display = player.isLocked ? 'block' : 'none';
      }
    });
    window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
    window.addEventListener('mousedown', e => { if (e.button === 0) castShootSword(); });

    // Kỹ năng 1: Phóng phi kiếm có vung tay
    function castShootSword() {
      if (player.swords <= 0) return;
      player.swords--;

      // Kích hoạt animation chém kiếm của mô hình 3D
      if (playerActions['attack']) {
        playerActions['attack'].reset().fadeIn(0.1).play();
        setTimeout(() => playerActions['attack'].fadeOut(0.2), 350);
      }

      const sw = makeSword3D();
      const start = playerGroup.position.clone().add(new THREE.Vector3(0, 1.8, 0));
      const target = bossGroup.position.clone().add(new THREE.Vector3(0, 1.8, 0));
      const dir = target.sub(start).normalize();

      sw.position.copy(start);
      sw.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
      scene.add(sw);

      activeProjectiles.push({ mesh: sw, dir: dir, speed: 1.4, life: 60, damage: 25 });
    }

    // Kỹ năng 2: Phong Lôi Dực (Lướt chớp nhoáng)
    function castDash() {
      if (player.dashCd > 0 || player.mp < 15) return;
      player.mp -= 15;
      player.dashCd = 50;
      player.isDashing = true;

      const dir = new THREE.Vector3();
      if (keys['w']) dir.z -= 1;
      if (keys['s']) dir.z += 1;
      if (keys['a']) dir.x -= 1;
      if (keys['d']) dir.x += 1;
      if (dir.lengthSq() === 0) dir.z = -1;
      dir.normalize();

      playerGroup.position.addScaledVector(dir, 8.5);
      if (playerGroup.position.length() > 33) playerGroup.position.setLength(33);

      setTimeout(() => player.isDashing = false, 200);
    }

    // Kỹ năng 3: Thanh Trúc Kiếm Trận (12 Kiếm bao vây + Lôi Điện)
    function castSwordArray() {
      if (player.mp < 40 || player.swords < 6) return;
      player.mp -= 40;
      player.swords -= 6;

      const center = bossGroup.position.clone();
      const group = new THREE.Group();
      scene.add(group);

      const count = 12;
      const radius = 7;
      const arrayMeshes = [];

      for (let i = 0; i < count; i++) {
        const ang = (Math.PI * 2 / count) * i;
        const sw = makeSword3D();
        sw.position.set(center.x + Math.cos(ang) * radius, 1.8, center.z + Math.sin(ang) * radius);
        sw.rotation.x = Math.PI;
        group.add(sw);
        arrayMeshes.push(sw);
      }

      swordArrays.push({
        group: group, center: center, radius: radius,
        swords: arrayMeshes, duration: 280, tick: 0
      });
    }

    // Boss tấn công: Cầu Ma Hỏa đỏ rực
    function bossAttack() {
      if (bossActions['attack']) {
        bossActions['attack'].reset().fadeIn(0.1).play();
        setTimeout(() => bossActions['attack'].fadeOut(0.2), 400);
      }

      const start = bossGroup.position.clone().add(new THREE.Vector3(0, 2.0, 0));
      const dir = playerGroup.position.clone().sub(bossGroup.position).normalize();

      const ball = new THREE.Mesh(
        new THREE.SphereGeometry(0.6, 16, 16),
        new THREE.MeshBasicMaterial({ color: 0xff1100 })
      );
      ball.position.copy(start);
      scene.add(ball);

      bossProjectiles.push({ mesh: ball, dir: dir, speed: 0.5, damage: 18, life: 120 });
    }

    // Vẽ tia sét Tịch Tà Thần Lôi nối giữa 2 kiếm
    function drawLightning(p1, p2) {
      const pts = [p1];
      const segments = 5;
      for (let i = 1; i < segments; i++) {
        const mid = p1.clone().lerp(p2, i / segments);
        mid.add(new THREE.Vector3((Math.random() - 0.5) * 1.0, (Math.random() - 0.5) * 1.0, (Math.random() - 0.5) * 1.0));
        pts.push(mid);
      }
      pts.push(p2);

      const line = new THREE.Line(
        new THREE.BufferGeometry().setFromPoints(pts),
        new THREE.LineBasicMaterial({ color: 0x38bdf8, linewidth: 2 })
      );
      scene.add(line);
      setTimeout(() => scene.remove(line), 60);
    }

    // --- 7. VÒNG LẶP RENDER & CẬP NHẬT TRẠNG THÁI ---
    function update() {
      const delta = clock.getDelta();
      if (playerMixer) playerMixer.update(delta);
      if (bossMixer) bossMixer.update(delta);

      if (player.mp < player.maxMp) player.mp += 0.08;
      if (player.dashCd > 0) player.dashCd--;

      // Hồi kiếm lơ lửng
      if (player.swords < 12 && activeProjectiles.length === 0 && swordArrays.length === 0) {
        player.swords += 0.02;
      }

      // Di chuyển người chơi & đổi chuyển động hoạt họa (Blend Animation)
      const move = new THREE.Vector3();
      if (keys['w']) move.z -= 1;
      if (keys['s']) move.z += 1;
      if (keys['a']) move.x -= 1;
      if (keys['d']) move.x += 1;

      if (move.lengthSq() > 0) {
        move.normalize();
        playerGroup.position.addScaledVector(move, player.speed);

        if (!player.isLocked) {
          playerGroup.rotation.y = Math.atan2(move.x, move.z);
        } else {
          // Khi Lock-on, nhân vật luôn quay mặt về Boss
          const toBoss = bossGroup.position.clone().sub(playerGroup.position);
          playerGroup.rotation.y = Math.atan2(toBoss.x, toBoss.z);
        }

        if (playerActions['run'] && !playerActions['run'].isRunning()) {
          playerActions['idle'].fadeOut(0.2);
          playerActions['run'].reset().fadeIn(0.2).play();
        }
      } else {
        if (playerActions['run'] && playerActions['run'].isRunning()) {
          playerActions['run'].fadeOut(0.2);
          playerActions['idle'].reset().fadeIn(0.2).play();
        }
        if (player.isLocked) {
          const toBoss = bossGroup.position.clone().sub(playerGroup.position);
          playerGroup.rotation.y = Math.atan2(toBoss.x, toBoss.z);
        }
      }

      if (playerGroup.position.length() > 33) playerGroup.position.setLength(33);

      // Quỹ đạo 12 Phi Kiếm xoay quanh thân
      player.orbitAngle += 0.035;
      const count = Math.floor(player.swords);
      for (let i = 0; i < 12; i++) {
        if (i < count) {
          orbitSwords[i].visible = true;
          const ang = player.orbitAngle + (Math.PI * 2 / count) * i;
          orbitSwords[i].position.set(
            playerGroup.position.x + Math.cos(ang) * 2.8,
            playerGroup.position.y + 1.8 + Math.sin(player.orbitAngle * 2 + i) * 0.35,
            playerGroup.position.z + Math.sin(ang) * 2.8
          );
          orbitSwords[i].rotation.y = -ang;
          orbitSwords[i].rotation.z = Math.PI / 4;
        } else {
          orbitSwords[i].visible = false;
        }
      }

      // Xử lý phi kiếm bay đi
      for (let i = activeProjectiles.length - 1; i >= 0; i--) {
        const sw = activeProjectiles[i];
        sw.mesh.position.addScaledVector(sw.dir, sw.speed);
        sw.life--;

        if (sw.mesh.position.distanceTo(bossGroup.position.clone().add(new THREE.Vector3(0, 1.8, 0))) < 2.2) {
          boss.hp -= sw.damage;
          scene.remove(sw.mesh);
          activeProjectiles.splice(i, 1);
          if (player.swords < 12) player.swords++;
          continue;
        }
        if (sw.life <= 0) {
          scene.remove(sw.mesh);
          activeProjectiles.splice(i, 1);
          if (player.swords < 12) player.swords++;
        }
      }

      // Xử lý Kiếm Trận & Sét giật
      for (let i = swordArrays.length - 1; i >= 0; i--) {
        const arr = swordArrays[i];
        arr.duration--;
        arr.tick++;
        arr.group.rotation.y += 0.015;

        if (arr.tick % 6 === 0 && arr.swords.length > 2) {
          const idx1 = Math.floor(Math.random() * arr.swords.length);
          const idx2 = (idx1 + 4) % arr.swords.length;
          const p1 = new THREE.Vector3(); arr.swords[idx1].getWorldPosition(p1);
          const p2 = new THREE.Vector3(); arr.swords[idx2].getWorldPosition(p2);
          drawLightning(p1, p2);
        }

        if (arr.center.distanceTo(bossGroup.position) < arr.radius) {
          if (arr.tick % 15 === 0) boss.hp -= 12;
          bossGroup.position.lerp(arr.center, 0.02);
        }

        if (arr.duration <= 0) {
          scene.remove(arr.group);
          swordArrays.splice(i, 1);
          player.swords = Math.min(12, player.swords + 6);
        }
      }

      // AI Boss
      if (boss.hp > 0) {
        const toPlayer = playerGroup.position.clone().sub(bossGroup.position);
        bossGroup.rotation.y = Math.atan2(toPlayer.x, toPlayer.z);

        if (toPlayer.length() > 9) {
          toPlayer.normalize();
          bossGroup.position.addScaledVector(toPlayer, boss.speed);
          if (bossActions['run'] && !bossActions['run'].isRunning()) {
            bossActions['idle'].fadeOut(0.2);
            bossActions['run'].reset().fadeIn(0.2).play();
          }
        } else {
          if (bossActions['run'] && bossActions['run'].isRunning()) {
            bossActions['run'].fadeOut(0.2);
            bossActions['idle'].reset().fadeIn(0.2).play();
          }
        }

        boss.attackCd--;
        if (boss.attackCd <= 0) {
          boss.attackCd = 110;
          bossAttack();
        }
      } else {
        bossGroup.position.y = -20;
      }

      // Xử lý Ma Hỏa của Boss
      for (let i = bossProjectiles.length - 1; i >= 0; i--) {
        const sp = bossProjectiles[i];
        sp.mesh.position.addScaledVector(sp.dir, sp.speed);
        sp.life--;

        if (sp.mesh.position.distanceTo(playerGroup.position.clone().add(new THREE.Vector3(0, 1.8, 0))) < 1.8) {
          if (!player.isDashing) player.hp -= sp.damage;
          scene.remove(sp.mesh);
          bossProjectiles.splice(i, 1);
          continue;
        }
        if (sp.life <= 0) {
          scene.remove(sp.mesh);
          bossProjectiles.splice(i, 1);
        }
      }

      // Camera: Chuyển đổi giữa chế độ Tự do và Lock-on Soul-like
      if (player.isLocked && boss.hp > 0) {
        const midPoint = playerGroup.position.clone().lerp(bossGroup.position, 0.4);
        const camPos = playerGroup.position.clone().add(
          playerGroup.position.clone().sub(bossGroup.position).normalize().multiplyScalar(10).add(new THREE.Vector3(0, 6, 0))
        );
        camera.position.lerp(camPos, 0.1);
        camera.lookAt(midPoint.x, midPoint.y + 1.8, midPoint.z);

        // Cập nhật vị trí Reticle trên màn hình
        const screenPos = bossGroup.position.clone().add(new THREE.Vector3(0, 2.5, 0)).project(camera);
        const reticle = document.getElementById('lock-reticle');
        reticle.style.left = `${(screenPos.x * 0.5 + 0.5) * window.innerWidth}px`;
        reticle.style.top = `${(-screenPos.y * 0.5 + 0.5) * window.innerHeight}px`;
      } else {
        const camPos = playerGroup.position.clone().add(new THREE.Vector3(0, 6, 11));
        camera.position.lerp(camPos, 0.1);
        camera.lookAt(playerGroup.position.x, playerGroup.position.y + 1.8, playerGroup.position.z - 4);
      }

      // Cập nhật UI
      document.getElementById('hp-bar').style.width = `${Math.max(0, (player.hp / player.maxHp) * 100)}%`;
      document.getElementById('mp-bar').style.width = `${Math.max(0, (player.mp / player.maxMp) * 100)}%`;
      document.getElementById('sense-bar').style.width = `${(Math.floor(player.swords) / 12) * 100}%`;
      document.getElementById('boss-hp-fill').style.width = `${Math.max(0, (boss.hp / boss.maxHp) * 100)}%`;
    }

    function animate() {
      requestAnimationFrame(animate);
      update();
      composer.render();
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      composer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
