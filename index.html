<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phàm Nhân Tu Tiên 3D - Quyết Đấu Lôi Đài</title>
  <!-- Thư viện Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    body {
      background-color: #05080c;
      color: #f8fafc;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Bảng giao diện HUD */
    .hud-panel {
      position: absolute;
      background: rgba(10, 15, 26, 0.75);
      padding: 12px 18px;
      border-radius: 8px;
      border: 1px solid rgba(56, 189, 248, 0.25);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px);
      pointer-events: none;
      z-index: 10;
    }

    #player-hud {
      top: 20px;
      left: 20px;
      width: 320px;
    }

    #boss-hud {
      top: 20px;
      right: 20px;
      width: 360px;
      border-color: rgba(239, 68, 68, 0.4);
    }

    .character-name {
      font-size: 14px;
      font-weight: bold;
      color: #38bdf8;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .boss-title {
      color: #f87171;
      text-align: right;
    }

    .boss-status-text {
      font-size: 11px;
      color: #fca5a5;
      text-align: right;
      margin-top: 4px;
    }

    .bar-group {
      display: flex;
      align-items: center;
      margin-bottom: 6px;
      gap: 10px;
      font-size: 12px;
    }

    .label {
      width: 65px;
      color: #94a3b8;
    }

    .bar-bg {
      flex: 1;
      height: 12px;
      background: #0f172a;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid #334155;
    }

    .bar-fill {
      height: 100%;
      width: 100%;
      transition: width 0.15s ease-out;
    }

    .bar-fill.hp {
      background: linear-gradient(90deg, #dc2626, #ef4444);
    }

    .bar-fill.mp {
      background: linear-gradient(90deg, #0284c7, #38bdf8);
    }

    .bar-fill.sense {
      background: linear-gradient(90deg, #7c3aed, #a855f7);
    }

    .bar-fill.boss-hp {
      background: linear-gradient(90deg, #991b1b, #ef4444);
    }

    /* Bảng hiển thị phím kỹ năng */
    #skills-ui {
      position: absolute;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 14px;
      pointer-events: none;
      z-index: 10;
    }

    .skill-item {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid #334155;
      padding: 8px 16px;
      border-radius: 6px;
      text-align: center;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
    }

    .skill-item .key {
      font-size: 11px;
      color: #38bdf8;
      font-weight: bold;
    }

    .skill-item .name {
      font-size: 13px;
      font-weight: 500;
      color: #e2e8f0;
    }

    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: rgba(255, 255, 255, 0.4);
      font-size: 20px;
      pointer-events: none;
      z-index: 10;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <!-- HUD Người Chơi -->
    <div id="player-hud" class="hud-panel">
      <div class="character-name">Hàn Lập (Trúc Cơ Kỳ)</div>
      <div class="bar-group">
        <span class="label">Khí Huyết:</span>
        <div class="bar-bg"><div id="player-hp" class="bar-fill hp"></div></div>
      </div>
      <div class="bar-group">
        <span class="label">Pháp Lực:</span>
        <div class="bar-bg"><div id="player-mp" class="bar-fill mp"></div></div>
      </div>
      <div class="bar-group">
        <span class="label">Thần Thức:</span>
        <div class="bar-bg"><div id="player-sense" class="bar-fill sense"></div></div>
      </div>
    </div>

    <!-- HUD Boss Đối Kháng -->
    <div id="boss-hud" class="hud-panel">
      <div class="character-name boss-title">Cực Âm Ma Tu (Kết Đan Sơ Kỳ)</div>
      <div class="bar-group">
        <span class="label">Ma Lực:</span>
        <div class="bar-bg"><div id="boss-hp" class="bar-fill boss-hp"></div></div>
      </div>
      <div id="boss-state" class="boss-status-text">Trạng thái: Cuồng nộ</div>
    </div>

    <!-- Bảng Kỹ Năng / Phím Điều Khiển -->
    <div id="skills-ui">
      <div class="skill-item">
        <span class="key">Chuột Trái / J</span>
        <span class="name">Ngự Kiếm Quyết</span>
      </div>
      <div class="skill-item">
        <span class="key">Space / K</span>
        <span class="name">Phong Lôi Dực</span>
      </div>
      <div class="skill-item">
        <span class="key">Q / U</span>
        <span class="name">Kiếm Trận (40 MP)</span>
      </div>
      <div class="skill-item">
        <span class="key">E / I</span>
        <span class="name">Liễm Khí / Hộ Thể</span>
      </div>
    </div>

    <div id="crosshair">+</div>
  </div>

  <script>
    // Thiết lập Three.js Scene, Camera, Renderer
    const container = document.getElementById('game-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0f1d);
    scene.fog = new THREE.FogExp2(0x0a0f1d, 0.015);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    // Hệ thống chiếu sáng
    const ambientLight = new THREE.AmbientLight(0x334155, 1.2);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.8);
    dirLight.position.set(20, 40, 20);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 2048;
    dirLight.shadow.mapSize.height = 2048;
    scene.add(dirLight);

    // Điểm sáng lôi đài trung tâm
    const arenaLight = new THREE.PointLight(0x38bdf8, 2, 40);
    arenaLight.position.set(0, 10, 0);
    scene.add(arenaLight);

    // Sàn đấu Lôi Đài Thạch (Arena Platform)
    const arenaGeo = new THREE.CylinderGeometry(35, 38, 2, 64);
    const arenaMat = new THREE.MeshStandardMaterial({ 
      color: 0x1e293b, 
      roughness: 0.8,
      metalness: 0.2
    });
    const arena = new THREE.Mesh(arenaGeo, arenaMat);
    arena.position.y = -1;
    arena.receiveShadow = true;
    scene.add(arena);

    // Vòng ranh giới Lôi Đài Cấm Chế
    const ringGeo = new THREE.RingGeometry(34.8, 35.2, 64);
    const ringMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8, side: THREE.DoubleSide });
    const arenaRing = new THREE.Mesh(ringGeo, ringMat);
    arenaRing.rotation.x = -Math.PI / 2;
    arenaRing.position.y = 0.02;
    scene.add(arenaRing);

    // --- NHÂN VẬT CHÍNH (HÀN LẬP) ---
    const playerGroup = new THREE.Group();
    scene.add(playerGroup);

    // Thân đạo bào thanh y
    const bodyGeo = new THREE.CylinderGeometry(0.5, 0.7, 1.8, 16);
    const bodyMat = new THREE.MeshStandardMaterial({ color: 0x0284c7, roughness: 0.5 });
    const playerMesh = new THREE.Mesh(bodyGeo, bodyMat);
    playerMesh.position.y = 0.9;
    playerMesh.castShadow = true;
    playerGroup.add(playerMesh);

    // Đầu
    const headGeo = new THREE.SphereGeometry(0.35, 16, 16);
    const headMat = new THREE.MeshStandardMaterial({ color: 0xfbd5bd });
    const headMesh = new THREE.Mesh(headGeo, headMat);
    headMesh.position.y = 2.0;
    headMesh.castShadow = true;
    playerGroup.add(headMesh);

    playerGroup.position.set(0, 0, 15);

    // Chỉ số người chơi
    const player = {
      hp: 100,
      maxHp: 100,
      mp: 100,
      maxMp: 100,
      speed: 0.25,
      orbitAngle: 0,
      swordsCount: 12,
      isDashing: false,
      dashCooldown: 0,
      shieldActive: false
    };

    // --- HỆ THỐNG PHI KIẾM QUANH THÂN (ORBIT SWORDS) ---
    const swords = [];
    const swordGeo = new THREE.ConeGeometry(0.08, 1.1, 8);
    const swordMat = new THREE.MeshStandardMaterial({ 
      color: 0x38bdf8, 
      emissive: 0x0284c7, 
      emissiveIntensity: 0.8,
      metalness: 0.9, 
      roughness: 0.1 
    });

    for (let i = 0; i < 12; i++) {
      const sw = new THREE.Mesh(swordGeo, swordMat);
      sw.castShadow = true;
      scene.add(sw);
      swords.push(sw);
    }

    // --- BOSS: CỰC ÂM MA TU ---
    const bossGroup = new THREE.Group();
    scene.add(bossGroup);

    const bossBodyGeo = new THREE.CylinderGeometry(0.7, 0.9, 2.2, 16);
    const bossBodyMat = new THREE.MeshStandardMaterial({ color: 0x450a0a, roughness: 0.4 });
    const bossMesh = new THREE.Mesh(bossBodyGeo, bossBodyMat);
    bossMesh.position.y = 1.1;
    bossMesh.castShadow = true;
    bossGroup.add(bossMesh);

    const bossHeadGeo = new THREE.SphereGeometry(0.45, 16, 16);
    const bossHeadMat = new THREE.MeshStandardMaterial({ color: 0x991b1b });
    const bossHead = new THREE.Mesh(bossHeadGeo, bossHeadMat);
    bossHead.position.y = 2.4;
    bossGroup.add(bossHead);

    bossGroup.position.set(0, 0, -15);

    const boss = {
      hp: 500,
      maxHp: 500,
      speed: 0.12,
      attackCooldown: 100,
      state: 'chase'
    };

    // Quản lý đạn và kiếm trận
    const activeProjectiles = [];
    const bossProjectiles = [];
    const swordArrays = [];

    // --- BỘ ĐIỀU KHIỂN & SỰ KIỆN ---
    const keys = {};
    window.addEventListener('keydown', e => {
      keys[e.key.toLowerCase()] = true;

      if (e.key === ' ' || e.key.toLowerCase() === 'k') {
        castDash();
      }
      if (e.key.toLowerCase() === 'q' || e.key.toLowerCase() === 'u') {
        castSwordArray();
      }
      if (e.key.toLowerCase() === 'e' || e.key.toLowerCase() === 'i') {
        player.shieldActive = !player.shieldActive;
      }
      if (e.key.toLowerCase() === 'j') {
        castShootSword();
      }
    });

    window.addEventListener('keyup', e => {
      keys[e.key.toLowerCase()] = false;
    });

    window.addEventListener('mousedown', e => {
      if (e.button === 0) castShootSword();
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix;
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- KỸ NĂNG & CHIÊU THỨC ---

    // 1. Phóng phi kiếm bay đến Boss
    function castShootSword() {
      if (player.swordsCount <= 0) return;
      player.swordsCount--;

      const startPos = playerGroup.position.clone().add(new THREE.Vector3(0, 1.2, 0));
      const targetPos = bossGroup.position.clone().add(new THREE.Vector3(0, 1.2, 0));
      const dir = targetPos.sub(startPos).normalize();

      const projectile = new THREE.Mesh(swordGeo, swordMat);
      projectile.position.copy(startPos);
      projectile.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
      scene.add(projectile);

      activeProjectiles.push({
        mesh: projectile,
        dir: dir,
        speed: 1.2,
        life: 60,
        damage: 22
      });
    }

    // 2. Phong Lôi Dực - Lướt 3D né đòn
    function castDash() {
      if (player.dashCooldown > 0 || player.mp < 15) return;
      player.mp -= 15;
      player.dashCooldown = 60;
      player.isDashing = true;

      const moveDir = new THREE.Vector3();
      if (keys['w']) moveDir.z -= 1;
      if (keys['s']) moveDir.z += 1;
      if (keys['a']) moveDir.x -= 1;
      if (keys['d']) moveDir.x += 1;

      if (moveDir.lengthSq() === 0) moveDir.z = -1;
      moveDir.normalize();

      playerGroup.position.addScaledVector(moveDir, 7);

      if (playerGroup.position.length() > 32) {
        playerGroup.position.setLength(32);
      }

      setTimeout(() => { player.isDashing = false; }, 200);
    }

    // 3. Thanh Trúc Kiếm Trận (Phím Q / U)
    function castSwordArray() {
      if (player.mp < 40 || player.swordsCount < 6) return;
      player.mp -= 40;
      player.swordsCount -= 6;

      const targetCenter = bossGroup.position.clone();
      targetCenter.y = 0.5;

      const arrayGroup = new THREE.Group();
      scene.add(arrayGroup);

      const radius = 6;
      const count = 10;
      for (let i = 0; i < count; i++) {
        const ang = (Math.PI * 2 / count) * i;
        const arraySword = new THREE.Mesh(swordGeo, swordMat);
        arraySword.position.set(
          targetCenter.x + Math.cos(ang) * radius,
          1.5,
          targetCenter.z + Math.sin(ang) * radius
        );
        arraySword.rotation.x = Math.PI;
        arrayGroup.add(arraySword);
      }

      swordArrays.push({
        group: arrayGroup,
        center: targetCenter,
        radius: radius,
        duration: 300,
        tick: 0
      });
    }

    // Boss tấn công: Bắn Ma Hỏa
    function bossCastAttack() {
      const startPos = bossGroup.position.clone().add(new THREE.Vector3(0, 1.5, 0));
      const dir = playerGroup.position.clone().sub(bossGroup.position).normalize();

      const sphereGeo = new THREE.SphereGeometry(0.4, 16, 16);
      const sphereMat = new THREE.MeshBasicMaterial({ color: 0xef4444 });
      const ball = new THREE.Mesh(sphereGeo, sphereMat);
      ball.position.copy(startPos);
      scene.add(ball);

      bossProjectiles.push({
        mesh: ball,
        dir: dir,
        speed: 0.45,
        damage: 18,
        life: 120
      });
    }

    // --- VÒNG LẶP LOGIC GAME (UPDATE) ---
    function update() {
      // Hồi phục Pháp Lực
      if (player.mp < player.maxMp) player.mp += 0.08;
      if (player.dashCooldown > 0) player.dashCooldown--;

      // Hồi kiếm lơ lửng nếu còn slot
      if (player.swordsCount < 12 && activeProjectiles.length === 0 && swordArrays.length === 0) {
        player.swordsCount += 0.02;
      }

      // Xử lý di chuyển
      const move = new THREE.Vector3();
      if (keys['w']) move.z -= 1;
      if (keys['s']) move.z += 1;
      if (keys['a']) move.x -= 1;
      if (keys['d']) move.x += 1;

      if (move.lengthSq() > 0) {
        move.normalize();
        playerGroup.position.addScaledVector(move, player.speed);

        const targetAngle = Math.atan2(move.x, move.z);
        playerGroup.rotation.y = targetAngle;
      }

      // Giới hạn trong sàn đấu
      if (playerGroup.position.length() > 33) {
        playerGroup.position.setLength(33);
      }

      // Cập nhật vị trí các thanh kiếm lơ lửng quanh người
      player.orbitAngle += 0.03;
      const currentCount = Math.floor(player.swordsCount);
      for (let i = 0; i < 12; i++) {
        if (i < currentCount) {
          swords[i].visible = true;
          const angle = player.orbitAngle + (Math.PI * 2 / currentCount) * i;
          const dist = 2.2;
          swords[i].position.set(
            playerGroup.position.x + Math.cos(angle) * dist,
            playerGroup.position.y + 1.2 + Math.sin(player.orbitAngle * 2 + i) * 0.25,
            playerGroup.position.z + Math.sin(angle) * dist
          );
          swords[i].rotation.y = -angle;
          swords[i].rotation.z = Math.PI / 6;
        } else {
          swords[i].visible = false;
        }
      }

      // Cập nhật phi kiếm bay
      for (let i = activeProjectiles.length - 1; i >= 0; i--) {
        const proj = activeProjectiles[i];
        proj.mesh.position.addScaledVector(proj.dir, proj.speed);
        proj.life--;

        const distToBoss = proj.mesh.position.distanceTo(bossGroup.position);
        if (distToBoss < 2.0) {
          boss.hp -= proj.damage;
          scene.remove(proj.mesh);
          activeProjectiles.splice(i, 1);
          if (player.swordsCount < 12) player.swordsCount++;
          continue;
        }

        if (proj.life <= 0) {
          scene.remove(proj.mesh);
          activeProjectiles.splice(i, 1);
          if (player.swordsCount < 12) player.swordsCount++;
        }
      }

      // Cập nhật Kiếm Trận
      for (let i = swordArrays.length - 1; i >= 0; i--) {
        const arr = swordArrays[i];
        arr.duration--;
        arr.tick++;
        arr.group.rotation.y += 0.02;

        const distToBoss = arr.center.distanceTo(bossGroup.position);
        if (distToBoss < arr.radius) {
          if (arr.tick % 20 === 0) {
            boss.hp -= 10;
          }
          bossGroup.position.lerp(arr.center, 0.02);
        }

        if (arr.duration <= 0) {
          scene.remove(arr.group);
          swordArrays.splice(i, 1);
          player.swordsCount = Math.min(12, player.swordsCount + 6);
        }
      }

      // AI Boss
      if (boss.hp > 0) {
        const toPlayer = playerGroup.position.clone().sub(bossGroup.position);
        const dist = toPlayer.length();

        bossGroup.rotation.y = Math.atan2(toPlayer.x, toPlayer.z);

        if (dist > 8) {
          toPlayer.normalize();
          bossGroup.position.addScaledVector(toPlayer, boss.speed);
        }

        boss.attackCooldown--;
        if (boss.attackCooldown <= 0) {
          boss.attackCooldown = 110;
          bossCastAttack();
        }
      } else {
        document.getElementById('boss-state').innerText = "Trạng thái: Bị tiêu diệt!";
        bossGroup.position.y = -10;
      }

      // Cập nhật ma hỏa
      for (let i = bossProjectiles.length - 1; i >= 0; i--) {
        const bp = bossProjectiles[i];
        bp.mesh.position.addScaledVector(bp.dir, bp.speed);
        bp.life--;

        const distToPlayer = bp.mesh.position.distanceTo(playerGroup.position);
        if (distToPlayer < 1.6) {
          if (!player.isDashing) {
            const dmg = player.shieldActive ? bp.damage * 0.3 : bp.damage;
            player.hp -= dmg;
          }
          scene.remove(bp.mesh);
          bossProjectiles.splice(i, 1);
          continue;
        }

        if (bp.life <= 0) {
          scene.remove(bp.mesh);
          bossProjectiles.splice(i, 1);
        }
      }

      // Camera góc nhìn thứ ba bám sát người chơi
      const cameraOffset = new THREE.Vector3(0, 5, 9);
      camera.position.copy(playerGroup.position).add(cameraOffset);
      camera.lookAt(playerGroup.position.x, playerGroup.position.y + 1.2, playerGroup.position.z - 4);

      // Cập nhật thanh máu & mana trên HUD
      document.getElementById('player-hp').style.width = `${Math.max(0, (player.hp / player.maxHp) * 100)}%`;
      document.getElementById('player-mp').style.width = `${Math.max(0, (player.mp / player.maxMp) * 100)}%`;
      document.getElementById('player-sense').style.width = `${(Math.floor(player.swordsCount) / 12) * 100}%`;
      document.getElementById('boss-hp').style.width = `${Math.max(0, (boss.hp / boss.maxHp) * 100)}%`;
    }

    // Vòng lặp render chuẩn 60 FPS
    function animate() {
      requestAnimationFrame(animate);
      update();
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
